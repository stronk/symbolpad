name: Build SymbolPad

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild \
            -project mac/SymbolPad.xcodeproj \
            -scheme SymbolPad \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
